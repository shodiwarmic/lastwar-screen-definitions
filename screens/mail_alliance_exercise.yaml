id: mail_alliance_exercise
version: 1
name: "[Alliance Exercise] Alliance Reward mail"
category: alliance_exercise
description: >
  The post-event mail for Alliance Exercise (sent after both Marshal's Guard
  and Large Sandworm). A greeting, the rewards, the MVP card (rank 1, which
  the list never shows), then "Damage Ranking 2-N": each row is a rank, the
  name, and "Total Damage: 23.36G" on a second line about 0.025 H below the
  name. The MVP card and the list header stay pinned while rows scroll under
  them. Drawn from 1080x2404 captures (2026-09-27).

identification:
  # The service never auto-detects a mail: the caller always sends the
  # category. These signals serve consumers that classify, and the audit.
  page_signals:
    - "Alliance Reward"
    - "Damage Ranking"
  negative_signals:
    - "Strength Ranking"
    - "Daily Rank"
    - "Weekly Rank"
    - "Alliance Contribution"
  pre_ocr_hint: null

boundaries:
  header:
    # "Damage Ranking 2-20" — on frame 1 it sits at y ~0.75, once the MVP
    # card has scrolled up it pins at ~0.45, so search the whole frame.
    signals: ["Damage Ranking"]
    search_region: {y_min: 0.0, y_max: 1.0}
  footer:
    # No footer text: the timestamp line (elements.timestamp) is the bottom.
    signals: []

chrome:
  top_fraction: 0.0
  bottom_fraction: 0.0

columns:
  # Rank digits (and the 2/3/4 medals) centre at x ~0.16. Names start at
  # x ~0.356; the "HAPPY BIRTHDAY" avatar frame text centres at ~0.28, so
  # the name column starts at 0.33. The damage line sits under the name.
  - {id: rank,  type: rank,  x_min: 0.05, x_max: 0.25}
  - {id: name,  type: name,  x_min: 0.33, x_max: 1.00}
  - {id: score, type: score, x_min: 0.33, x_max: 1.00}

row_clustering:
  strategy: column_scoped
  # The damage line is ~0.025 H below the name, the rank ~0.017 H below.
  column_scoped: {up_band_fraction: 0.035, down_band_fraction: 0.004}
  y_proximity: {tolerance_fraction: 0.008, min_tolerance_px: 8}
  min_score: 0
  score_format: suffixed
  # Cloud Vision returns "Total", "Damage", ":" as separate words;
  # PaddleOCR returns "Total Damage: 23.36G" as one.
  label_tokens: ["Total Damage:", "Total", "Damage:", "Damage", ":"]
  # Words in a mail name sit ~10 px apart, while Cloud Vision splits a tag
  # from its name ("[", "PoWr", "]", "Boom") with gaps of 0-2 px.
  word_gap_fraction: 0.005
  min_word_gap_px: 4

elements:
  fixed_rows:
    # The MVP card: name, power, "Attacks: 16", "Total Damage: 35.51G".
    - rank: 1
      value_label: "Total Damage:"
      skip_labels: ["Attacks:", "MVP"]
      region: above_header
  timestamp:
    search_region: {y_min: 0.80, y_max: 1.0}
