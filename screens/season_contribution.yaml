id: alliance_contribution
version: 2
name: Alliance Contribution Ranking
description: >
  Alliance member leaderboard for four war-event categories:
  Mutual Assistance, Siege, Rare Soil War, and Defeat.
  Two independent tab rows: the category row (full orange background on
  the active button) and the time-period row (Daily Ranking / Weekly
  Ranking / Season Total Ranking, white/bright text when active vs gray
  when inactive). The active combination is detected by colour-sampling
  each row independently and joining the winners as {category}_{period}.

identification:
  page_signals:
    - "Alliance Contribution"
    - "ALLIANCE CONTRIBUTION"
  negative_signals: []
  pre_ocr_hint: null

boundaries:
  header:
    signals: ["Ranking", "Name", "Points"]
    search_region: {y_min: 0.15, y_max: 0.30}
  footer:
    signals: []
    search_region: {y_min: 0.60, y_max: 1.0}

chrome:
  top_fraction: 0.22
  bottom_fraction: 0.12

tabs:
  # y_max raised to 0.30: the period tab row sits at ~y=0.22–0.26, just below the
  # category row (~y=0.18–0.22). The old 0.22 cutoff was clipping the period tabs.
  search_region: {y_min: 0.00, y_max: 0.30}
  y_hint: 0.20
  # Two independent detection groups. The service picks one winner per group
  # using that group's colour strategy, then joins them as category_period.
  groups:
    # Category row: active button has a full orange background.
    category: {strategy: color_fraction, min_fraction: 0.10}
    # Period row: active tab text is white; inactive tab text is gray.
    # "brightest" samples the text region for each tab and picks the most
    # white. min_fraction acts as a brightness-gap floor (active V minus
    # second-place V). Calibrated empirically across the 60 cropped Pixel
    # Fold inside-landscape fixtures where the gap ranges from ~0.012
    # (defeat_daily, mutual_assistance_daily) to ~0.04 (most others).
    # 0.008 leaves some headroom while remaining well above day-to-day noise
    # (~0.003) on adjacent inactive tabs.
    period:   {strategy: brightest,      min_fraction: 0.005}
  active_indicator:
    strategy: color_fraction
    min_fraction: 0.10
    color:
      named: orange
      hsv_override: {h_min: 0.014, h_max: 0.153, s_min: 0.40, v_min: 0.55}
    bbox_padding_fraction: 0.007
  items:
    # ── Category tabs — full orange background when active ──────────────────
    - {id: mutual_assistance, group: category, category: mutual_assistance,
       signals: ["Mutual Assistance", "Mutual"], x_hint: 0.12}
    - {id: siege,             group: category, category: siege,
       signals: ["Siege"],                      x_hint: 0.34}
    - {id: rare_soil_war,     group: category, category: rare_soil_war,
       signals: ["Rare Soil War", "Rare"],      x_hint: 0.54}
    - {id: defeat,            group: category, category: defeat,
       signals: ["Defeat"],                     x_hint: 0.73}
    # ── Time-period tabs — white text when active, gray when inactive ────────
    # All three labels appear on a single OCR line. The x_hint-centred sampling
    # window isolates each tab so the brightest (active) one is correctly chosen.
    # x_hints measured from device screenshots: daily≈0.13, weekly≈0.38, season≈0.64.
    - {id: daily,  group: period, category: daily,
       signals: ["Daily Ranking",        "Daily"],         x_hint: 0.13}
    - {id: weekly, group: period, category: weekly,
       signals: ["Weekly Ranking",       "Weekly"],        x_hint: 0.38}
    - {id: season, group: period, category: season,
       signals: ["Season Total Ranking", "Season Total"],  x_hint: 0.64}

columns:
  - {id: rank,  type: ignore, x_min: 0.00, x_max: 0.15}
  - {id: name,  type: name,   x_min: 0.15, x_max: 0.60}
  - {id: score, type: score,  x_min: 0.60, x_max: 1.00}

row_clustering:
  strategy: score_anchored
  score_anchored: {up_band_fraction: 0.021, down_band_fraction: 0.002}
  y_proximity: {tolerance_fraction: 0.02, min_tolerance_px: 20}
  min_score: 1000
  word_gap_fraction: 0.015
  min_word_gap_px: 8
