id: season_contribution
version: 1
name: Season Contribution Ranking
description: >
  Season Contribution leaderboard covering four war-event categories:
  Mutual Assistance, Siege, Rare Soil War, and Defeat. Each tab shows
  Daily, Weekly, and Season Total sub-rankings. The category is always
  provided explicitly by the caller; auto-detection is not used.

identification:
  page_signals:
    - "Season Contribution Ranking"
    - "SEASON CONTRIBUTION"
  negative_signals: []
  pre_ocr_hint: null

boundaries:
  header:
    signals: ["Ranking", "Name", "Points"]
    search_region: {y_min: 0.0, y_max: 0.40}
  footer:
    signals: []
    search_region: {y_min: 0.60, y_max: 1.0}

chrome:
  top_fraction: 0.22
  bottom_fraction: 0.12

tabs:
  search_region: {y_min: 0.00, y_max: 0.30}
  y_hint: 0.18
  active_indicator:
    strategy: color_fraction
    min_fraction: 0.10
    color:
      named: orange
      hsv_override: {h_min: 0.014, h_max: 0.153, s_min: 0.40, v_min: 0.55}
    bbox_padding_fraction: 0.007
  items:
    # Mutual Assistance — 3 time-period sub-tabs
    - {id: mutual_assistance_daily,   category: mutual_assistance_daily,   signals: ["Mutual", "Assistance", "Daily"],          x_hint: 0.13}
    - {id: mutual_assistance_weekly,  category: mutual_assistance_weekly,  signals: ["Mutual", "Assistance", "Weekly"],         x_hint: 0.13}
    - {id: mutual_assistance_season,  category: mutual_assistance_season,  signals: ["Mutual", "Assistance", "Season"],         x_hint: 0.13}
    # Siege — 3 time-period sub-tabs
    - {id: siege_daily,               category: siege_daily,               signals: ["Siege", "Daily"],                         x_hint: 0.37}
    - {id: siege_weekly,              category: siege_weekly,              signals: ["Siege", "Weekly"],                        x_hint: 0.37}
    - {id: siege_season,              category: siege_season,              signals: ["Siege", "Season"],                        x_hint: 0.37}
    # Rare Soil War — 3 time-period sub-tabs
    - {id: rare_soil_war_daily,       category: rare_soil_war_daily,       signals: ["Rare", "Soil", "War", "Daily"],           x_hint: 0.62}
    - {id: rare_soil_war_weekly,      category: rare_soil_war_weekly,      signals: ["Rare", "Soil", "War", "Weekly"],          x_hint: 0.62}
    - {id: rare_soil_war_season,      category: rare_soil_war_season,      signals: ["Rare", "Soil", "War", "Season"],          x_hint: 0.62}
    # Defeat — 3 time-period sub-tabs
    - {id: defeat_daily,              category: defeat_daily,              signals: ["Defeat", "Daily"],                        x_hint: 0.87}
    - {id: defeat_weekly,             category: defeat_weekly,             signals: ["Defeat", "Weekly"],                       x_hint: 0.87}
    - {id: defeat_season,             category: defeat_season,             signals: ["Defeat", "Season"],                       x_hint: 0.87}

columns:
  - {id: rank,  type: ignore, x_min: 0.00, x_max: 0.15}
  - {id: name,  type: name,   x_min: 0.15, x_max: 0.60}
  - {id: score, type: score,  x_min: 0.60, x_max: 1.00}

row_clustering:
  strategy: score_anchored
  score_anchored: {up_band_fraction: 0.021, down_band_fraction: 0.002}
  y_proximity: {tolerance_fraction: 0.02, min_tolerance_px: 20}
  min_score: 1000
  word_gap_fraction: 0.015
  min_word_gap_px: 8
