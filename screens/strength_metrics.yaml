id: strength_metrics
version: 1
name: Strength Ranking — Metrics
description: >
  Strength Ranking screen with the Power or Kills row-1 tab active. The
  third row-1 tab (Donation) opens a sub-tab row (Daily | Weekly) which
  is handled by strength_donation.yaml; this screen never matches that
  state because both Daily and Weekly sub-tab labels appear together
  there and the "Daily Weekly" negative_signal rejects.
  See README.md "Multi-row tab patterns" — this is Pattern B (one parent
  state per screen YAML), same as Daily VS / Weekly VS.

identification:
  page_signals:
    - "Strength Ranking"
    - "STRENGTH"
  negative_signals:
    # Reject other top-level screens whose OCR text could overlap.
    - "Daily Rank"
    - "Weekly Rank"
    - "Alliance Contribution"
    # Day-tab labels never appear on Strength Ranking; their presence
    # means we're actually on Daily VS.
    - "Mon."
    - "Tues."
    - "Wed."
    - "Thur."
    - "Fri."
    - "Sat."
    # Reject the Donation+sub-tab state — strength_donation handles it.
    # Multi-word negative requires both words to appear together; this
    # only fires when the Donation sub-tab row is rendered (both labels
    # visible side-by-side).
    - "Daily Weekly"
  pre_ocr_hint:
    x_hint: 0.15
    y_hint: 0.20
    color:
      named: orange
      hsv_override: {h_min: 0.014, h_max: 0.153, s_min: 0.40, v_min: 0.55}
    confidence: 0.90

boundaries:
  header:
    signals: ["Commander", "Power", "Kills", "Donation"]
    search_region: {y_min: 0.0, y_max: 0.40}
  footer:
    signals: ["Your Alliance"]
    search_region: {y_min: 0.60, y_max: 1.0}

chrome:
  top_fraction: 0.22
  bottom_fraction: 0.12

tabs:
  search_region: {y_min: 0.00, y_max: 0.30}
  y_hint: 0.20
  active_indicator:
    strategy: color_fraction
    min_fraction: 0.10
    color:
      named: orange
      hsv_override: {h_min: 0.014, h_max: 0.153, s_min: 0.40, v_min: 0.55}
    bbox_padding_fraction: 0.007
  items:
    - {id: power, category: power, signals: ["Power"], x_hint: 0.15}
    - {id: kills, category: kills, signals: ["Kills"], x_hint: 0.50}

columns:
  - {id: rank,  type: ignore, x_min: 0.00, x_max: 0.15}
  - {id: name,  type: name,   x_min: 0.15, x_max: 0.60}
  - {id: score, type: score,  x_min: 0.60, x_max: 1.00}

row_clustering:
  strategy: score_anchored
  score_anchored: {up_band_fraction: 0.021, down_band_fraction: 0.002}
  y_proximity: {tolerance_fraction: 0.02, min_tolerance_px: 20}
  min_score: 1000
  word_gap_fraction: 0.015
  min_word_gap_px: 8
