id: strength_ranking
version: 2
name: Strength Ranking
description: >
  Alliance member leaderboard with three top-level metric tabs: Power, Kills,
  and Donation. The Donation tab has Daily and Weekly sub-tabs that control
  the time window shown. Each combination maps to its own backend category.

identification:
  page_signals:
    - "Strength Ranking"
    - "STRENGTH"
  pre_ocr_hint:
    x_hint: 0.15
    y_hint: 0.20
    color:
      named: orange
      hsv_override: {h_min: 0.014, h_max: 0.153, s_min: 0.40, v_min: 0.55}
    confidence: 0.90

boundaries:
  header:
    signals: ["Commander", "Power", "Kills", "Donation"]
    search_region: {y_min: 0.0, y_max: 0.40}
    anchor_offset: {type: below_bottom_edge, offset_fraction: 0.0}
  footer:
    signals: ["Your Alliance"]
    search_region: {y_min: 0.60, y_max: 1.0}
    anchor_offset: {type: above_top_edge, offset_fraction: 0.0}

chrome:
  top_fraction: 0.22
  bottom_fraction: 0.12

tabs:
  search_region: {y_min: 0.00, y_max: 0.30}
  y_hint: 0.20
  active_indicator:
    strategy: color_fraction
    min_fraction: 0.10
    color:
      named: orange
      hsv_override: {h_min: 0.014, h_max: 0.153, s_min: 0.40, v_min: 0.55}
    bbox_padding_fraction: 0.007
  items:
    - {id: power,           category: power,           signals: ["Power"],             x_hint: 0.15}
    - {id: kills,           category: kills,           signals: ["Kills"],             x_hint: 0.50}
    - {id: donation_daily,  category: donation_daily,  signals: ["Donation", "Daily"],  x_hint: 0.85}
    - {id: donation_weekly, category: donation_weekly, signals: ["Donation", "Weekly"], x_hint: 0.85}

columns:
  - {id: rank,  type: ignore, x_min: 0.00, x_max: 0.15}
  - {id: name,  type: name,   x_min: 0.15, x_max: 0.60}
  - {id: score, type: score,  x_min: 0.60, x_max: 1.00}

row_clustering:
  strategy: score_anchored
  score_anchored: {up_band_fraction: 0.021, down_band_fraction: 0.002}
  y_proximity: {tolerance_fraction: 0.02, min_tolerance_px: 20}
  min_score: 1000
  word_gap_fraction: 0.015
  min_word_gap_px: 8
